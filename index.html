<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Tip calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1 class="logo" aria-label="Splitter">SPLI<span>TTER</span></h1>

      <section class="calculator-card" aria-label="Tip calculator">
        <form class="calculator-form" novalidate>
          <div class="field-group">
            <label for="bill">Bill</label>
            <div class="input-wrap">
              <img src="./images/icon-dollar.svg" alt="" aria-hidden="true" />
              <input id="bill" name="bill" type="number" min="0" step="0.01" placeholder="0" inputmode="decimal" />
            </div>
          </div>

          <fieldset class="tip-fieldset">
            <legend>Select Tip %</legend>
            <div class="tip-grid">
              <button class="tip-button" type="button" data-tip="5">5%</button>
              <button class="tip-button" type="button" data-tip="10">10%</button>
              <button class="tip-button" type="button" data-tip="15">15%</button>
              <button class="tip-button" type="button" data-tip="25">25%</button>
              <button class="tip-button" type="button" data-tip="50">50%</button>
              <label class="custom-tip-label" aria-label="Custom tip percentage">
                <input id="custom-tip" type="number" min="0" step="1" placeholder="Custom" inputmode="numeric" />
              </label>
            </div>
          </fieldset>

          <div class="field-group people-group">
            <div class="label-row">
              <label for="people">Number of People</label>
              <p class="error-message" role="alert" aria-live="polite"></p>
            </div>
            <div class="input-wrap">
              <img src="./images/icon-person.svg" alt="" aria-hidden="true" />
              <input id="people" name="people" type="number" min="1" step="1" placeholder="0" inputmode="numeric" />
            </div>
          </div>
        </form>

        <section class="results" aria-label="Calculation results">
          <div class="result-row">
            <p class="result-label">Tip Amount<span>/ person</span></p>
            <output id="tip-amount" aria-live="polite">$0.00</output>
          </div>

          <div class="result-row">
            <p class="result-label">Total<span>/ person</span></p>
            <output id="total-amount" aria-live="polite">$0.00</output>
          </div>

          <button id="reset" class="reset-button" type="button" disabled>Reset</button>
        </section>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/Code-Surgeon-Hossam">Hossam Abdulraouf</a>.
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
